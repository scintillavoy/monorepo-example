apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  selector:
    matchLabels:
      app: notes-api
  replicas: 1
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
        - name: notes-api
          image: registry.example.com/monorepo-example/notes:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/api"]
          env:
            - name: API_CONFIG_PATH
              value: /etc/config/config.yaml
            - name: API_SECRET_PATH
              value: /etc/secret/secret.yaml
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: secret-volume
              mountPath: /etc/secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 3001
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            failureThreshold: 2
            periodSeconds: 10
      volumes:
        - name: config-volume
          configMap:
            name: notes-api-config
        - name: secret-volume
          secret:
            secretName: notes-api-secret
