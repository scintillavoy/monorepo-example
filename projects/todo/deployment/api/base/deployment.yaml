apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: todo
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  selector:
    matchLabels:
      app: todo-api
  replicas: 1
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      containers:
        - name: todo-api
          image: registry.example.com/monorepo-example/todo:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/api"]
          env:
            - name: CONFIG_PATH
              value: /etc/config/config.yaml
            - name: VAULT_TOKEN_PATH
              value: /etc/secret/VAULT_TOKEN
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
            - name: secret-volume
              mountPath: /etc/secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            failureThreshold: 2
            periodSeconds: 10
      volumes:
        - name: config-volume
          configMap:
            name: todo-api-config
        - name: secret-volume
          secret:
            secretName: todo-api-secret
