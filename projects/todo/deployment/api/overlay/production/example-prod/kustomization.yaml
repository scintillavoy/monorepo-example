apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base
  - configmap.yaml

patches:
  - path: patch.yaml
    target:
      group: apps
      kind: Deployment
      name: todo-api
      namespace: todo
      version: v1

images:
  - name: registry.example.com/monorepo-example/todo
    newTag: example-prod
