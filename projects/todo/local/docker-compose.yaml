services:
  mysql:
    image: mysql:8.0.29
    container_name: todo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: my_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./my.cnf:/etc/mysql/my.cnf
      - ./temp/mysql-data:/var/lib/mysql
      - ./temp/logs/mysql:/var/log/mysql
      - ../migrations:/docker-entrypoint-initdb.d/migrations
      - ./run-migrations.sh:/docker-entrypoint-initdb.d/00_run-migrations.sh
      - ./test-data.sql:/docker-entrypoint-initdb.d/01_test-data.sql
    command:
      - /bin/sh
      - -c
      - |
        chmod +x /docker-entrypoint-initdb.d/00_run-migrations.sh
        exec /usr/local/bin/docker-entrypoint.sh mysqld \
          --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: "mysql -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e '/* ping */ SELECT 1'"
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
